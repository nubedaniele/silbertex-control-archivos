<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Archivos PCP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: una columna de trabajo — carga de archivos arriba, veredicto, luego detalle por talle. */
:root{
  --bg:#f3f5f5; --surface:#ffffff; --ink:#14282b; --muted:#5b6e71; --line:#d8e0e1;
  --petrol:#0f3a40; --petrol-ink:#e8f1f2; --accent:#0e6f78;
  --ok:#1d7a4a; --ok-bg:#e3f3ea; --warn:#9a6200; --warn-bg:#fbf0d9; --bad:#b3261e; --bad-bg:#fbe5e3;
  --chip:#eef2f3;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1718; --surface:#142224; --ink:#e3ecec; --muted:#93a7a9; --line:#26393b;
  --petrol:#0b2d31; --petrol-ink:#d9eaec; --accent:#4fb8c2;
  --ok:#5fcf91; --ok-bg:#12301f; --warn:#e8b45a; --warn-bg:#33270f; --bad:#ff8a80; --bad-bg:#3a1714;
  --chip:#1c2e30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1718; --surface:#142224; --ink:#e3ecec; --muted:#93a7a9; --line:#26393b;
  --petrol:#0b2d31; --petrol-ink:#d9eaec; --accent:#4fb8c2;
  --ok:#5fcf91; --ok-bg:#12301f; --warn:#e8b45a; --warn-bg:#33270f; --bad:#ff8a80; --bad-bg:#3a1714;
  --chip:#1c2e30; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.band{background:var(--petrol);color:var(--petrol-ink)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{padding-block:22px 20px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--f-num);font-weight:700;font-size:32px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
header p{margin:0;opacity:.8;font-size:14px}
main.wrap{padding-block:22px 48px;display:grid;gap:22px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.drops{grid-template-columns:1fr}}
.drop{position:relative;background:var(--surface);border:1.5px dashed var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:4px;cursor:pointer;min-width:0;transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop .lab{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drop .name{font-weight:600;overflow-wrap:anywhere}
.drop .hint{font-size:13px;color:var(--muted)}
.drop.loaded{border-style:solid}
.note{font-size:13px;color:var(--muted);margin:-8px 0 0}
.arts{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:grid;gap:10px}
.arts h2,.sec h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.artlist{display:flex;flex-wrap:wrap;gap:8px}
.mrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.art{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-width:0;max-width:100%}
.art input{margin-top:4px;accent-color:var(--accent)}
.art b{font-weight:600}
.art small{display:block;color:var(--muted);font-size:12.5px}
.verdict{border-radius:10px;padding:18px 20px;display:grid;gap:6px;border:1px solid}
.verdict.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok)}
.verdict.warn{background:var(--warn-bg);border-color:var(--warn)}
.verdict .tag{font-family:var(--f-num);font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.verdict.bad .tag{color:var(--bad)} .verdict.ok .tag{color:var(--ok)} .verdict.warn .tag{color:var(--warn)}
.verdict .meta{font-size:14px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;font-variant-numeric:tabular-nums}
.stats b{font-family:var(--f-num);font-size:20px;font-weight:700;margin-right:4px}
.example{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);color:var(--muted);border-radius:4px;padding:2px 8px;margin-bottom:2px;justify-self:start}
.sec{display:grid;gap:10px}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.issue{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:6px;padding:10px 14px;display:grid;gap:2px}
.issue.bad{border-left-color:var(--bad)} .issue.warn{border-left-color:var(--warn)} .issue.info{border-left-color:var(--accent)}
.issue .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.issue.bad .k{color:var(--bad)} .issue.warn .k{color:var(--warn)} .issue.info .k{color:var(--accent)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:680px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.t{font-family:var(--f-num);font-weight:700;font-size:20px;width:70px}
td.q{width:110px;font-size:14px;white-space:nowrap}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--f-num);font-weight:700;font-size:16px;min-width:34px;text-align:center;padding:1px 7px;border-radius:5px;background:var(--chip);border:1px solid transparent;line-height:1.5}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.miss{background:transparent;color:var(--bad);border:1.5px dashed var(--bad)}
.chip.err{background:var(--bad);color:var(--surface)}
.chip.extra{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .chip{font-size:13px;min-width:26px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-weight:600;border-radius:8px;padding:9px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:150px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
details .raw{font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere;margin-top:8px}
.err-box{background:var(--bad-bg);border:1px solid var(--bad);border-radius:10px;padding:14px 18px}
.spin{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="band"><div class="wrap">
  <h1>Control de archivos</h1>
  <p>Pedido PDF + archivo Corel → errores antes de sublimar</p>
</div></header>

<main class="wrap">
  <section class="drops" aria-label="Archivos">
    <label class="drop" id="dropPdf">
      <input type="file" id="inPdf" accept="application/pdf,.pdf">
      <span class="lab">1 · Pedido (PDF)</span>
      <span class="name" id="namePdf">Elegí o arrastrá el PDF del pedido</span>
      <span class="hint">El que sale de la planilla de pedidos</span>
    </label>
    <label class="drop" id="dropCdr">
      <input type="file" id="inCdr" accept=".cdr,.zip">
      <span class="lab">2 · Diseño (CorelDRAW)</span>
      <span class="name" id="nameCdr">Elegí o arrastrá el .cdr</span>
      <span class="hint">También sirve la copia de seguridad (.zip)</span>
    </label>
  </section>
  <p class="note">Los archivos se leen en tu navegador. No se suben a ningún lado.</p>

  <div id="status"></div>
  <section class="arts" id="arts" hidden>
    <h2>Artículos que están en este archivo</h2>
    <div class="artlist" id="artlist"></div>
    <div class="mrow"><label for="selMangas">Mangas por prenda</label>
      <select id="selMangas"><option value="auto">Según el pedido</option><option value="0">0 · sin mangas (musculosa)</option><option value="1">1</option><option value="2">2</option></select></div>
  </section>
  <div id="report"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
/* Motor de control: pedido (PDF de Google Sheets) vs archivo CorelDRAW (.cdr X4+ = ZIP) */
(function (G) {
  const LETTER_TALLES = ['XXS','XS','S','M','L','XL','XXL','2XL','3XL','4XL','5XL','XXXL'];
  const normTalle = t => {
    t = String(t).trim().toUpperCase().replace(/\s+/g, '');
    if (t === 'XXL') return '2XL';
    if (t === 'XXXL') return '3XL';
    return t;
  };
  const isLetterTalle = t => LETTER_TALLES.includes(String(t).toUpperCase());
  const isTalleCell = t => /^(\d{1,2}|XXS|XS|S|M|L|XL|XXL|XXXL|[2-5]XL)$/i.test(String(t).trim());
  const TALLE_ORDER = ['0','2','4','6','8','10','12','14','16','XXS','XS','S','M','L','XL','2XL','3XL','4XL','5XL'];
  const talleRank = t => { const i = TALLE_ORDER.indexOf(t); return i < 0 ? 99 : i; };

  /* ---------- PDF del pedido ---------- */
  // items: [{page, x, y (hacia arriba), str, w?}]
  function mergeItems(items) {
    const clean = items.filter(i => i.str && i.str.trim() !== '').map(i => ({ ...i, w: i.w ?? i.str.length * 4 }));
    clean.sort((a, b) => a.page - b.page || b.y - a.y || a.x - b.x);
    const out = [];
    for (const it of clean) {
      const last = out[out.length - 1];
      if (last && last.page === it.page && Math.abs(last.y - it.y) < 1.5 && it.x - (last.x + last.w) < 4 && it.x >= last.x) {
        const gap = it.x - (last.x + last.w);
        last.str += (gap > 0.8 && !last.str.endsWith(' ') ? ' ' : '') + it.str;
        last.w = it.x + it.w - last.x;
      } else out.push({ ...it });
    }
    out.forEach(i => (i.str = i.str.replace(/\s+/g, ' ').trim()));
    return out;
  }

  function parseNumberList(txt) {
    const body = txt.replace(/^[^:]*:/, '');
    const res = [];
    for (let part of body.split('/')) {
      part = part.trim();
      if (!part) continue;
      const m = part.match(/\d{1,3}/);
      if (!m) continue;
      res.push({ n: String(parseInt(m[0], 10)), muestra: /muestra|\*/i.test(part) });
    }
    return res;
  }

  function parseOrder(rawItems) {
    const items = mergeItems(rawItems);
    const order = { numero: '', cliente: '', entrega: '', articulos: [] };
    const right = re => {
      const lab = items.find(i => re.test(i.str));
      if (!lab) return '';
      const cand = items.filter(i => i.page === lab.page && Math.abs(i.y - lab.y) < 4 && i.x > lab.x + 5).sort((a, b) => a.x - b.x);
      return cand[0] ? cand[0].str : '';
    };
    order.numero = right(/^N°\s*de\s*Orden/i);
    order.cliente = right(/^Cliente/i);
    order.entrega = right(/^Fecha\s*de\s*Entrega/i);

    const pos = it => it.page * 100000 + (10000 - it.y); // orden de lectura
    const arts = items.filter(i => /^ARTICULO\s*\d+/i.test(i.str)).sort((a, b) => pos(a) - pos(b));
    arts.forEach((a, k) => {
      const next = arts[k + 1];
      const region = items.filter(i => pos(i) >= pos(a) - 6 && (!next || pos(i) < pos(next) - 6));
      const art = {
        id: parseInt(a.str.match(/\d+/)[0], 10), descripcion: '', codigo: '', total: null, molde: '',
        colores: [], tela: '', detalles: '', filas: [], avisos: []
      };
      const descParts = region.filter(i => i.page === a.page && Math.abs(i.y - a.y) < 7 && i.x > a.x + 20 && !/CANTIDADES/i.test(i.str));
      art.descripcion = descParts.sort((p, q) => q.y - p.y || p.x - q.x).map(i => i.str).join(' ').replace(/\s*—\s*$/, '').trim();
      const cod = art.descripcion.match(/\b[A-Z]{4,6}\d{3}[A-Z]?\b/);
      if (cod) { art.codigo = cod[0]; art.descripcion = art.descripcion.replace(/\s*—?\s*[A-Z]{4,6}\d{3}[A-Z]?\s*$/, '').replace(/\s*—\s*$/, ''); }
      const tot = region.find(i => /CANTIDADES\s*TOTALES/i.test(i.str));
      if (tot) { const m = tot.str.match(/(\d+)\s*$/); if (m) art.total = parseInt(m[1], 10); }

      const hT = region.find(i => /^TALLE$/i.test(i.str));
      const hC = region.find(i => /^CANTIDAD$/i.test(i.str));
      const hO = region.find(i => /^OBSERVACIONES$/i.test(i.str));
      if (hT && hC) {
        const tCx = hT.x + hT.w / 2, cCx = hC.x + hC.w / 2;
        const filas = region
          .filter(i => i.page === hT.page && i.y < hT.y - 2 && isTalleCell(i.str) && Math.abs(i.x + i.w / 2 - tCx) < 22)
          .map(i => {
            const q = region.find(j => j.page === i.page && Math.abs(j.y - i.y) < 2.5 && /^\d+$/.test(j.str) && Math.abs(j.x + j.w / 2 - cCx) < 25);
            return { talle: normTalle(i.str), cantidad: q ? parseInt(q.str, 10) : null, y: i.y, page: i.page, obs: [] };
          })
          .filter(f => f.cantidad !== null)
          .sort((p, q) => q.y - p.y);
        const obsX = hO ? Math.min(hO.x, (hC.x + hC.w) + 10) : hC.x + hC.w + 10;
        region
          .filter(i => i.page === hT.page && i.y < hT.y - 2 && i.x >= obsX - 15 && i.x > hC.x + hC.w)
          .forEach(o => {
            let best = null;
            for (const f of filas) { const d = o.y - f.y; if (d > -2 && d < 16 && (!best || d < best.d)) best = { f, d }; }
            if (best) best.f.obs.push(o);
          });
        for (const f of filas) {
          const txt = f.obs.sort((p, q) => q.y - p.y || p.x - q.x).map(o => o.str).join(' ');
          f.observaciones = txt;
          const mN = txt.match(/N[ÚU]MEROS?\s*:([^]*?)(?=NOMBRES?\s*:|$)/i);
          f.numeros = mN ? parseNumberList(':' + mN[1]) : [];
          const mNo = txt.match(/NOMBRES?\s*:([^]*?)(?=N[ÚU]MEROS?\s*:|$)/i);
          f.nombres = mNo ? mNo[1].split('/').map(s => s.trim()).filter(Boolean) : [];
          delete f.obs; delete f.y; delete f.page;
        }
        art.filas = filas;
      }
      const molLab = region.find(i => /^MOLDE$/i.test(i.str));
      if (molLab) {
        const m = region.filter(i => i.page === molLab.page && i.y < molLab.y && molLab.y - i.y < 30 && /^[A-Z]{2,4}\d{2,4}[A-Z]?$/.test(i.str)).sort((p, q) => q.y - p.y)[0];
        if (m) art.molde = m.str;
      }
      if (!art.molde) { const m = region.find(i => /^VC[A-Z]\d{3}$/.test(i.str)); if (m) art.molde = m.str; }
      art.colores = region.map(i => i.str.match(/^Color\s*\d\s*:\s*(.+)$/i)).filter(Boolean).map(m => m[1].trim()).filter(c => !/^NO$/i.test(c));
      const telaLab = region.find(i => /^Tela$/i.test(i.str));
      if (telaLab) {
        art.tela = region.filter(i => i.page === telaLab.page && i.y < telaLab.y && telaLab.y - i.y < 32 && Math.abs(i.x - telaLab.x) < 40 && !/^Color/i.test(i.str) && !isTalleCell(i.str))
          .sort((p, q) => q.y - p.y).map(i => i.str).join(' ');
      }
      const panoLab = region.find(i => /^Pa[ñn]o Sublimado/i.test(i.str));
      if (panoLab) {
        const vs = region.filter(i => i.page === panoLab.page && Math.abs(i.y - panoLab.y) < 9 && i.x > panoLab.x + 20 && i.x < panoLab.x + 125).sort((p, q) => q.y - p.y || p.x - q.x);
        art.pano = vs.map(v => v.str).join(' ').replace(/\s+/g, ' ').trim();
      } else art.pano = '';
      const detLab = region.find(i => /^Detalles de venta/i.test(i.str));
      if (detLab) art.detalles = region.filter(i => i.page === detLab.page && i.y < detLab.y && detLab.y - i.y < 60 && Math.abs(i.x - detLab.x) < 6).sort((p, q) => q.y - p.y).map(i => i.str).join(' · ');
      order.articulos.push(art);
    });
    return order;
  }

  /* ---------- Avisos del propio pedido ---------- */
  function checkOrder(order) {
    const avisos = [];
    for (const a of order.articulos) {
      let suma = 0;
      for (const f of a.filas) {
        suma += f.cantidad;
        const cant = f.numeros.length;
        if (cant && cant !== f.cantidad) avisos.push({ nivel: 'error', art: a.id, talle: f.talle, msg: `El pedido dice ${f.cantidad} unidades pero lista ${cant} números.` });
        if (!cant && tipoArticulo(a) === 'prenda') avisos.push({ nivel: 'aviso', art: a.id, talle: f.talle, msg: `Talle sin números cargados.` });
        const seen = {};
        f.numeros.forEach(n => (seen[n.n] = (seen[n.n] || 0) + 1));
        for (const [n, c] of Object.entries(seen)) if (c > 1) avisos.push({ nivel: 'aviso', art: a.id, talle: f.talle, msg: `El número ${n} está ${c} veces en el mismo talle. Confirmar con el vendedor si es correcto.` });
      }
      if (a.total != null && suma !== a.total) avisos.push({ nivel: 'error', art: a.id, msg: `La suma por talle da ${suma} y el total del artículo dice ${a.total}.` });
    }
    return avisos;
  }

  /* ---------- CDR (ZIP) ---------- */
  async function readBytes(blob, start, len) { return new Uint8Array(await blob.slice(start, start + len).arrayBuffer()); }
  const u16 = (b, o) => b[o] | (b[o + 1] << 8);
  const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
  const u64 = (b, o) => u32(b, o) + u32(b, o + 4) * 4294967296;

  async function zipEntries(blob) {
    const size = blob.size;
    const head = await readBytes(blob, 0, 4);
    if (head[0] === 0x52 && head[1] === 0x49 && head[2] === 0x46 && head[3] === 0x46) throw new Error('VIEJO');
    if (!(head[0] === 0x50 && head[1] === 0x4b)) throw new Error('NOZIP');
    const tailLen = Math.min(size, 65557);
    const tail = await readBytes(blob, size - tailLen, tailLen);
    let e = -1;
    for (let i = tail.length - 22; i >= 0; i--) if (u32(tail, i) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error('NOZIP');
    let cdSize = u32(tail, e + 12), cdOff = u32(tail, e + 16), count = u16(tail, e + 10);
    if (cdOff === 0xffffffff || cdSize === 0xffffffff || count === 0xffff) {
      const loc = e - 20;
      if (loc >= 0 && u32(tail, loc) === 0x07064b50) {
        const z64off = u64(tail, loc + 8);
        const z = await readBytes(blob, z64off, 56);
        count = u64(z, 32); cdSize = u64(z, 40); cdOff = u64(z, 48);
      }
    }
    const cd = await readBytes(blob, cdOff, cdSize);
    const list = [];
    let p = 0;
    const dec = new TextDecoder();
    while (p + 46 <= cd.length && u32(cd, p) === 0x02014b50) {
      const method = u16(cd, p + 10);
      let comp = u32(cd, p + 20), unc = u32(cd, p + 24);
      const nl = u16(cd, p + 28), xl = u16(cd, p + 30), cl = u16(cd, p + 32);
      let lho = u32(cd, p + 42);
      const name = dec.decode(cd.subarray(p + 46, p + 46 + nl));
      let x = p + 46 + nl;
      const xe = x + xl;
      while (x + 4 <= xe) {
        const id = u16(cd, x), sz = u16(cd, x + 2);
        if (id === 1) {
          let q = x + 4;
          if (unc === 0xffffffff) { unc = u64(cd, q); q += 8; }
          if (comp === 0xffffffff) { comp = u64(cd, q); q += 8; }
          if (lho === 0xffffffff) { lho = u64(cd, q); q += 8; }
        }
        x += 4 + sz;
      }
      list.push({ name, method, comp, unc, lho });
      p = xe + cl;
    }
    return list;
  }

  async function readEntry(blob, ent) {
    const lh = await readBytes(blob, ent.lho, 30);
    const start = ent.lho + 30 + u16(lh, 26) + u16(lh, 28);
    const data = await readBytes(blob, start, ent.comp);
    if (ent.method === 0) return data;
    if (ent.method !== 8) throw new Error('Compresión no soportada');
    const ds = new DecompressionStream('deflate-raw');
    const buf = await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(buf);
  }

  const decodeXml = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16))).replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d)).replace(/&amp;/g, '&');

  async function readCdr(blob, fileName) {
    const ents = await zipEntries(blob);
    const ti = ents.find(e => /textinfo\.xml$/i.test(e.name));
    if (!ti) throw new Error('SINTEXTO');
    const xml = new TextDecoder().decode(await readEntry(blob, ti));
    const textos = [];
    const reS = /<TextStream\b[^>]*>([\s\S]*?)<\/TextStream>/g;
    let m;
    while ((m = reS.exec(xml))) {
      const runs = [...m[1].matchAll(/<TextRun\b[^>]*>([\s\S]*?)<\/TextRun>/g)].map(r => decodeXml(r[1]));
      textos.push(runs.join(' ').replace(/\s+/g, ' ').trim());
    }
    const imagenes = new Set();
    for (const e of ents.filter(e => /content\/data\/page\d+\.dat$/i.test(e.name) && e.unc < 80e6)) {
      const b = await readEntry(blob, e);
      let cur = '';
      for (let i = 0; i + 1 < b.length; i += 2) {
        const c = b[i] | (b[i + 1] << 8);
        if (c >= 32 && c < 0xfffe && b[i + 1] < 0x30) cur += String.fromCharCode(c);
        else { if (/\.(jpe?g|png|tiff?|bmp|pdf|psd|ai|eps)$/i.test(cur.trim())) imagenes.add(cur.trim()); cur = ''; }
      }
      // también en posición impar
      cur = '';
      for (let i = 1; i + 1 < b.length; i += 2) {
        const c = b[i] | (b[i + 1] << 8);
        if (c >= 32 && c < 0xfffe && b[i + 1] < 0x30) cur += String.fromCharCode(c);
        else { if (/\.(jpe?g|png|tiff?|bmp|pdf|psd|ai|eps)$/i.test(cur.trim())) imagenes.add(cur.trim()); cur = ''; }
      }
    }
    const moldes = new Set();
    (fileName || '').toUpperCase().replace(/[_\s]/g, ' ').match(/\b[A-Z]{3}\d{3}\b/g)?.forEach(x => /^VC/.test(x) && moldes.add(x));
    textos.forEach(t => (t.toUpperCase().match(/\bVC[A-Z]\d{3}\b/g) || []).forEach(x => moldes.add(x)));
    return { textos, imagenes: [...imagenes].map(x => x.replace(/^.*[\\/]/, '')), moldes: [...moldes], entradas: ents.length };
  }

  /* ---------- Reconocer camisetas en los textos del CDR ---------- */
  // Cada camiseta = [número, talle] en frente + [número, talle] en espalda (en el orden interno del archivo)
  function findGarments(textos, expected) {
    const expTalles = new Set(expected.map(e => e.talle));
    const expSet = new Set(expected.map(e => e.talle + '|' + e.n));
    const tok = textos.map(t => t.trim());
    const isNum = t => /^\d{1,3}$/.test(t);
    const asNum = t => String(parseInt(t, 10));
    const talleOf = t => {
      const u = normTalle(t);
      if (isLetterTalle(u) || u === '2XL' || u === '3XL' || u === '4XL' || u === '5XL') return u;
      if (/^\d{1,2}$/.test(u) && expTalles.has(String(parseInt(u, 10)))) return String(parseInt(u, 10));
      return null;
    };
    const N = tok.length;
    const best = new Array(N + 1).fill(0), choice = new Array(N + 1).fill(null);
    for (let i = N - 1; i >= 0; i--) {
      best[i] = best[i + 1] - 1; choice[i] = { k: 'skip', len: 1 };
      if (i + 3 < N && isNum(tok[i]) && isNum(tok[i + 2])) {
        const t = talleOf(tok[i + 1]), t2 = talleOf(tok[i + 3]);
        if (t && t === t2) {
          const a = asNum(tok[i]), b = asNum(tok[i + 2]);
          let s;
          if (a === b) {
            s = a === t ? (expSet.has(t + '|' + a) ? 15 : -8) : 10 + (expSet.has(t + '|' + a) ? 5 : 0);
            if (best[i + 4] + s > best[i]) { best[i] = best[i + 4] + s; choice[i] = { k: 'ok', len: 4, talle: t, n: a }; }
          } else {
            s = 4;
            if (a === t || b === t) s = -99; // casi siempre es una etiqueta de talle suelta
            if (expSet.has(t + '|' + a) || expSet.has(t + '|' + b)) s += 3;
            if (best[i + 4] + s > best[i]) { best[i] = best[i + 4] + s; choice[i] = { k: 'mix', len: 4, talle: t, a, b }; }
          }
        }
      }
    }
    const res = [];
    for (let i = 0; i < N;) { const c = choice[i]; if (c.k !== 'skip') res.push({ ...c, idx: i }); i += c.len; }
    return res;
  }

  /* ---------- Tipo de artículo ---------- */
  function tipoArticulo(art) {
    const d = (art.descripcion || '').toUpperCase().trim();
    if (/^(SOLO\s+)?PA[ÑN]OS?\b/.test(d)) return 'pano';
    if (/^(PAR(ES)?\s+DE\s+|SOLO\s+)?MANGAS?\b/.test(d)) return 'mangas';
    return 'prenda';
  }
  const llevaPano = art => tipoArticulo(art) === 'pano' || (art.pano && !/^(NO|NO APLICA|-|N\/A)?$/i.test(art.pano.trim()));

  /* ---------- Mangas por prenda según la descripción del artículo ---------- */
  function mangasDe(art) {
    const tipo = tipoArticulo(art);
    if (tipo === 'mangas') return 2;
    if (tipo === 'pano') return null;
    const d = (art.descripcion + ' ' + art.codigo).toUpperCase();
    if (/MUSCULOSA|SIN\s*MANGA|TANK/.test(d)) return 0;
    if (/\bSHORT|BERMUDA|PANTAL|CALZA|POLLERA|MEDIA|GORRA|BOLSO/.test(d)) return null; // no aplica
    return 2;
  }

  /* ---------- Comparación ---------- */
  function compare(order, articleIds, cdr, opts = {}) {
    const arts = order.articulos.filter(a => articleIds.includes(a.id));
    const expected = [];
    arts.filter(a => tipoArticulo(a) === 'prenda').forEach(a => a.filas.forEach(f => f.numeros.forEach(n => expected.push({ art: a.id, talle: f.talle, n: n.n, muestra: n.muestra }))));
    let garments = findGarments(cdr.textos, expected);
    const allGarments = garments;

    // Tabla de talles del molde: un mismo número repetido en muchos talles que no están pedidos
    const byNum = {};
    garments.forEach(g => { const n = g.k === 'ok' ? g.n : null; if (n) (byNum[n] = byNum[n] || new Set()).add(g.talle); });
    const plantilla = [];
    for (const [n, ts] of Object.entries(byNum)) {
      if (ts.size >= 4) {
        const fuera = [...ts].filter(t => !expected.some(e => e.talle === t && e.n === n));
        if (fuera.length >= 3) plantilla.push({ n, talles: [...ts] });
      }
    }
    const plantillaNums = new Set(plantilla.map(p => p.n));
    garments = garments.filter(g => !(g.k === 'ok' && plantillaNums.has(g.n) && !expected.some(e => e.talle === g.talle && e.n === g.n)));

    // Emparejar
    const pend = expected.map(e => ({ ...e, ok: false }));
    const take = (t, n) => { const e = pend.find(x => !x.ok && x.talle === t && x.n === n); if (e) { e.ok = true; return e; } return null; };
    const errores = [], sobrantes = [], encontrados = [];
    const capSame = {};
    for (const g of garments.filter(g => g.k === 'ok')) {
      if (g.n === g.talle) { const k = g.talle; capSame[k] = (capSame[k] || 0) + 1; }
      const e = take(g.talle, g.n);
      if (e) encontrados.push({ talle: g.talle, n: g.n, art: e.art });
      else if (g.n !== g.talle) sobrantes.push({ talle: g.talle, n: g.n });
    }
    for (const g of garments.filter(g => g.k === 'mix' && !plantillaNums.has(g.a) && !plantillaNums.has(g.b))) {
      let e = take(g.talle, g.a), cubre = g.a, otro = g.b;
      if (!e) { e = take(g.talle, g.b); cubre = g.b; otro = g.a; }
      if (e) {
        errores.push({ tipo: 'frente-espalda', talle: g.talle, n: cubre, otro, art: e.art,
          msg: `La camiseta ${cubre} tiene un ${otro} en una de sus piezas (frente o espalda).` });
        encontrados.push({ talle: g.talle, n: cubre, art: e.art, error: true });
      } else {
        errores.push({ tipo: 'frente-espalda', talle: g.talle, n: g.a, otro: g.b,
          msg: `Hay una camiseta con ${g.a} en una pieza y ${g.b} en la otra, y ninguno de los dos números falta en el pedido.` });
      }
    }
    const faltantes = pend.filter(e => !e.ok);

    // Resumen por talle
    const soloMangas = arts.filter(a => tipoArticulo(a) === 'mangas');
    const tallesMangas = soloMangas.flatMap(a => a.filas.map(f => f.talle));
    const talles = [...new Set([...expected.map(e => e.talle), ...encontrados.map(e => e.talle), ...sobrantes.map(s => s.talle), ...tallesMangas])].sort((a, b) => talleRank(a) - talleRank(b));
    const porTalle = talles.map(t => {
      const pedido = expected.filter(e => e.talle === t);
      const enArchivo = encontrados.filter(e => e.talle === t).length + sobrantes.filter(s => s.talle === t).length;
      return {
        talle: t,
        pedido: pedido.length,
        archivo: enArchivo,
        faltan: faltantes.filter(f => f.talle === t).map(f => f.n),
        sobran: sobrantes.filter(s => s.talle === t).map(s => s.n),
        errores: errores.filter(e => e.talle === t),
        numerosPedido: pedido.map(p => p.n + (p.muestra ? '*' : '')),
        arts: [...new Set(pedido.map(p => p.art))]
      };
    });
    const tallesAusentes = porTalle.filter(p => p.pedido > 0 && p.archivo === 0).map(p => p.talle);

    // Mangas / puños: etiquetas de talle sueltas (2 por camiseta + a veces 1 título por grupo)
    const mpArt = {};
    arts.forEach(a => (mpArt[a.id] = opts.mangas != null ? opts.mangas : mangasDe(a)));
    const vals = Object.values(mpArt);
    const mpDefault = vals.filter(v => v != null).sort((a, b) => vals.filter(x => x === b).length - vals.filter(x => x === a).length)[0] ?? null;
    const espPorTalle = {};
    const sumar = (t, art) => { const v = art != null && art in mpArt ? mpArt[art] : mpDefault; if (v != null) espPorTalle[t] = (espPorTalle[t] || 0) + v; };
    encontrados.forEach(e => sumar(e.talle, e.art));
    sobrantes.forEach(e => sumar(e.talle, null));
    errores.filter(e => !e.art).forEach(e => sumar(e.talle, null));
    const mangasSueltas = {};
    soloMangas.forEach(a => a.filas.forEach(f => { espPorTalle[f.talle] = (espPorTalle[f.talle] || 0) + 2 * f.cantidad; mangasSueltas[f.talle] = (mangasSueltas[f.talle] || 0) + f.cantidad; }));
    const mangas = vals.every(v => v == null)
      ? { contado: false, noAplica: true, filas: [] }
      : contarMangas(cdr.textos, allGarments, plantillaNums, [...expected, ...tallesMangas.map(t => ({ talle: t }))], porTalle, espPorTalle);
    if (mangas.filas) mangas.filas.forEach(f => (f.sueltas = mangasSueltas[f.talle] || 0));
    // Paño
    const panoPedido = arts.filter(llevaPano).map(a => ({ art: a.id, valor: tipoArticulo(a) === 'pano' ? 'artículo de paño' : a.pano }));
    const panoTextos = cdr.textos.filter(t => /PA[ÑN]O/i.test(t));
    const panoImgs = (cdr.imagenes || []).filter(t => /PA[ÑN]O/i.test(t));
    const pano = { pedido: panoPedido, esperado: panoPedido.length > 0, encontrado: panoTextos.length + panoImgs.length > 0, textos: panoTextos, imagenes: panoImgs };
    mangas.porArticulo = arts.map(a => ({ art: a.id, mangas: mpArt[a.id], auto: opts.mangas == null }));

    // Moldes
    const moldesPedido = [...new Set(arts.map(a => a.molde).filter(Boolean))];
    const moldeOk = !cdr.moldes.length || !moldesPedido.length || moldesPedido.every(m => cdr.moldes.includes(m));

    return {
      arts, expected, garments, plantilla, errores, mangas, pano, faltantes, sobrantes, porTalle, tallesAusentes,
      moldesPedido, moldesArchivo: cdr.moldes, moldeOk,
      totalPedido: expected.length, totalArchivo: encontrados.length + sobrantes.length
    };
  }

  function contarMangas(textos, allGarments, plantillaNums, expected, porTalle, espPorTalle) {
    const used = new Set();
    allGarments.forEach(g => { for (let k = 0; k < g.len; k++) used.add(g.idx + k); });
    // zona de la tabla de talles del molde (no es producción)
    const zona = [];
    allGarments.forEach(g => { if ((g.k === 'ok' && plantillaNums.has(g.n)) || (g.k === 'mix' && (plantillaNums.has(g.a) || plantillaNums.has(g.b)))) zona.push(g.idx, g.idx + 3); });
    textos.forEach((t, i) => { if (/\bVC[A-Z]\d{3}\b.*\b(CAMISETA|MUSCULOSA|SHORT|PANTAL|BUZO|CAMPERA|REMERA|CHOMBA)/i.test(t)) zona.push(i); });
    const z0 = zona.length ? Math.min(...zona) : Infinity, z1 = zona.length ? Math.max(...zona) + 3 : -1;
    const expTalles = new Set(expected.map(e => e.talle));
    const cuenta = {};
    textos.forEach((t, i) => {
      if (used.has(i) || (i >= z0 && i <= z1)) return;
      let u = normTalle(t);
      if (/^\d{1,2}$/.test(u)) { u = String(parseInt(u, 10)); if (!expTalles.has(u)) return; }
      else if (!(isLetterTalle(u) || /^[2-5]XL$/.test(u))) return;
      cuenta[u] = (cuenta[u] || 0) + 1;
    });
    const totalEtiq = Object.values(cuenta).reduce((a, b) => a + b, 0);
    const totalEsp = Object.values(espPorTalle).reduce((a, b) => a + b, 0);
    if (totalEsp > 0 && totalEtiq < totalEsp / 2) return { contado: false, filas: [] };
    const base = porTalle.filter(p => p.archivo > 0 || cuenta[p.talle] || espPorTalle[p.talle]).map(p => ({ p, etiq: cuenta[p.talle] || 0, esp: espPorTalle[p.talle] || 0 }));
    const masUno = base.filter(b => b.etiq - b.esp === 1).length, exactos = base.filter(b => b.etiq === b.esp).length;
    const conTitulos = masUno > exactos; // el archivo pone un título con el talle arriba de cada grupo
    const filas = base.map(({ p, etiq, esp }) => {
      const esperadas = esp + (conTitulos && (p.archivo > 0 || esp > 0) ? 1 : 0);
      const dif = etiq - esperadas;
      const estado = dif === 0 ? 'ok' : dif < 0 ? 'faltan' : 'sobran';
      const mangas = Math.max(0, etiq - (esperadas - esp));
      return { talle: p.talle, camisetas: p.archivo, mangasEsperadas: esp, mangas, etiquetas: etiq, estado, dif: estado === 'faltan' ? esp - mangas : Math.abs(dif) };
    });
    return { contado: true, conTitulos, filas };
  }

  function suggestArticles(order, cdr) {
    if (!cdr.moldes.length) return order.articulos.map(a => a.id);
    const ids = order.articulos.filter(a => cdr.moldes.includes(a.molde)).map(a => a.id);
    return ids.length ? ids : order.articulos.map(a => a.id);
  }

  G.Control = { mangasDe, tipoArticulo, llevaPano, parseOrder, checkOrder, readCdr, findGarments, compare, suggestArticles, mergeItems };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { order: null, cdr: null, pdfName: '', cdrName: '', ids: [], example: true, mangas: null };

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function pdfItems(file) {
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const items = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    for (const it of tc.items) if (it.str && it.str.trim()) items.push({ page: p, x: it.transform[4], y: it.transform[5], w: it.width, str: it.str });
  }
  return items;
}

function setStatus(html) { $('status').innerHTML = html; }

async function onPdf(file) {
  if (!file) return;
  $('namePdf').textContent = file.name; $('dropPdf').classList.add('loaded');
  setStatus('<p class="spin">Leyendo pedido…</p>');
  try {
    if (!window.pdfjsLib) throw new Error('No se pudo cargar el lector de PDF. Revisá la conexión y recargá la página.');
    const order = Control.parseOrder(await pdfItems(file));
    if (!order.articulos.length) throw new Error('No encontré artículos en el PDF. ¿Es el PDF de la planilla de pedidos?');
    if (state.example) { state.cdr = null; state.cdrName = ''; $('nameCdr').textContent = 'Elegí o arrastrá el .cdr'; $('dropCdr').classList.remove('loaded'); }
    state.example = false; state.order = order; state.pdfName = file.name;
    setStatus(''); refresh(true);
  } catch (e) { setStatus(`<div class="err-box">${esc(e.message)}</div>`); }
}

async function onCdr(file) {
  if (!file) return;
  $('nameCdr').textContent = file.name; $('dropCdr').classList.add('loaded');
  setStatus('<p class="spin">Leyendo archivo de Corel…</p>');
  try {
    const cdr = await Control.readCdr(file, file.name);
    if (state.example) { state.order = null; state.pdfName = ''; $('namePdf').textContent = 'Elegí o arrastrá el PDF del pedido'; $('dropPdf').classList.remove('loaded'); }
    state.example = false; state.cdr = cdr; state.cdrName = file.name;
    setStatus(''); refresh(true);
  } catch (e) {
    const msg = { VIEJO: 'Este .cdr es de una versión vieja de Corel (X3 o anterior) y no se puede leer. Guardalo en una versión más nueva.',
      NOZIP: 'Este archivo no parece un .cdr de Corel. Probá con el .cdr original o con la copia de seguridad.',
      SINTEXTO: 'El archivo no tiene textos legibles. Si los números están convertidos a curvas, hace falta una captura del armado.' }[e.message] || ('No se pudo leer el archivo: ' + e.message);
    setStatus(`<div class="err-box">${esc(msg)}</div>`);
  }
}

for (const [inp, drop, fn] of [['inPdf','dropPdf',onPdf],['inCdr','dropCdr',onCdr]]) {
  $(inp).addEventListener('change', e => fn(e.target.files[0]));
  const d = $(drop);
  d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', () => d.classList.remove('over'));
  d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('over'); fn(e.dataTransfer.files[0]); });
}

function renderArts() {
  const o = state.order;
  $('arts').hidden = !(o && state.cdr);
  if (!o || !state.cdr) return;
  $('artlist').innerHTML = o.articulos.map(a => `
    <label class="art"><input type="checkbox" id="art-${a.id}" data-id="${a.id}" ${state.ids.includes(a.id) ? 'checked' : ''} ${state.example ? 'disabled' : ''}>
      <span><b>Art. ${a.id} · ${esc(a.molde || 'sin molde')}</b><small>${a.total ?? '?'} u. · ${esc(a.colores.join(' / ') || '—')} · ${Control.tipoArticulo(a) === 'mangas' ? 'solo mangas' : Control.tipoArticulo(a) === 'pano' ? 'solo paño' : (m => m == null ? 'mangas no aplica' : m === 0 ? 'sin mangas' : m + ' mangas')(Control.mangasDe(a))}${Control.llevaPano(a) && Control.tipoArticulo(a) !== 'pano' ? ' · lleva paño' : ''}</small></span></label>`).join('');
  $('artlist').querySelectorAll('input').forEach(i => i.addEventListener('change', () => {
    state.ids = [...$('artlist').querySelectorAll('input:checked')].map(x => +x.dataset.id);
    renderReport();
  }));
}

$('selMangas').addEventListener('change', e => { state.mangas = e.target.value === 'auto' ? null : +e.target.value; renderReport(); });

function refresh(resetIds) {
  if (state.order && state.cdr && resetIds) state.ids = Control.suggestArticles(state.order, state.cdr);
  renderArts(); renderReport();
}

const fmtList = arr => arr.join(', ');
const detMangas = f => [f.camisetas ? `${f.camisetas} prenda${f.camisetas > 1 ? 's' : ''}` : '', f.sueltas ? `${f.sueltas} par${f.sueltas > 1 ? 'es' : ''} de mangas sueltas × 2` : ''].filter(Boolean).join(' + ');
const tl = t => /^\d/.test(t) ? 'T' + t : t;

function renderReport() {
  const o = state.order, c = state.cdr;
  if (!o || !c) {
    $('report').innerHTML = o || c ? `<p class="spin">Falta ${o ? 'el archivo de Corel' : 'el PDF del pedido'} para hacer el control.</p>` : '';
    return;
  }
  if (!state.ids.length) { $('report').innerHTML = '<p class="spin">Marcá al menos un artículo.</p>'; return; }
  const r = Control.compare(o, state.ids, c, { mangas: state.mangas });
  const avisosPedido = Control.checkOrder(o).filter(a => state.ids.includes(a.art));
  const nErr = r.errores.length, nFalt = r.faltantes.length, nSob = r.sobrantes.length;
  const mangasMal = r.mangas.contado ? r.mangas.filas.filter(f => f.estado !== 'ok' && (f.camisetas > 0 || f.mangasEsperadas > 0)) : [];
  const panoAviso = r.pano.esperado !== r.pano.encontrado ? 1 : 0;
  const nAvisoPed = avisosPedido.length, nErrPed = avisosPedido.filter(a => a.nivel === 'error').length;
  const bloqueante = nErr + nFalt + nSob + nErrPed + mangasMal.length + (r.moldeOk ? 0 : 1);
  const cls = bloqueante ? 'bad' : (nAvisoPed + panoAviso ? 'warn' : 'ok');
  const tag = bloqueante ? 'No liberar a sublimación' : (nAvisoPed + panoAviso ? 'Archivo OK · revisar avisos' : 'Archivo OK');
  const partes = [];
  if (nErr) partes.push(`${nErr} ${nErr === 1 ? 'camiseta con error' : 'camisetas con error'}`);
  if (nFalt) partes.push(`${nFalt} ${nFalt === 1 ? 'camiseta falta' : 'camisetas faltan'} en el archivo`);
  if (nSob) partes.push(`${nSob} ${nSob === 1 ? 'camiseta sobra' : 'camisetas sobran'}`);
  if (mangasMal.length) partes.push(`mangas mal en ${mangasMal.map(f => tl(f.talle)).join(', ')}`);
  if (r.pano.esperado && !r.pano.encontrado) partes.push('revisar paño');
  if (!r.moldeOk) partes.push('el molde no coincide');
  if (nAvisoPed) partes.push(`${nAvisoPed} ${nAvisoPed === 1 ? 'aviso' : 'avisos'} del pedido`);

  // Problemas
  const issues = [];
  if (!r.moldeOk) issues.push({ c: 'bad', k: 'Molde', m: `El pedido usa ${fmtList(r.moldesPedido)} y el archivo es ${fmtList(r.moldesArchivo)}.` });
  r.errores.forEach(e => issues.push({ c: 'bad', k: `Talle ${e.talle} · frente/espalda`, m: e.msg + ' Abrí esa camiseta en Corel y corregí el número.' }));
  if (r.tallesAusentes.length) {
    const det = r.tallesAusentes.map(t => { const p = r.porTalle.find(x => x.talle === t); return `${tl(t)} (${p.faltan.join(', ')})`; });
    issues.push({ c: 'bad', k: 'Talles completos que faltan', m: `No encontré ninguna camiseta de: ${det.join(' · ')}. Si están en otro archivo, desmarcá ese artículo o ignorá este punto. Si los números están en curvas, hace falta una captura para controlarlos.` });
  }
  r.porTalle.filter(p => p.faltan.length && !r.tallesAusentes.includes(p.talle)).forEach(p => {
    const sinError = p.faltan;
    issues.push({ c: 'bad', k: `Talle ${p.talle} · faltan`, m: `Faltan los números ${fmtList(sinError)}.` });
  });
  r.porTalle.filter(p => p.sobran.length).forEach(p => issues.push({ c: 'bad', k: `Talle ${p.talle} · sobran`, m: `Están en el archivo pero no en el pedido: ${fmtList(p.sobran)}.` }));
  mangasMal.forEach(f => issues.push({ c: 'bad', k: `Talle ${f.talle} · mangas`, m: f.mangasEsperadas > 0 && f.estado !== 'sobran' && f.estado !== 'faltan' ? '' : f.mangasEsperadas === 0 ? `Esta prenda no lleva mangas y en el archivo hay ${f.etiquetas} pieza${f.etiquetas > 1 ? 's' : ''} con el talle escrito que parecen mangas (puede incluir el título del grupo). ¿Se usó el molde equivocado?` : f.estado === 'faltan' ? `Falta${f.dif > 1 ? 'n' : ''} ${f.dif} manga${f.dif > 1 ? 's' : ''}: hay ${f.mangas} y van ${f.mangasEsperadas} (${detMangas(f)}).` : `Sobra${f.dif > 1 ? 'n' : ''} ${f.dif} manga${f.dif > 1 ? 's' : ''}: hay ${f.mangas} y van ${f.mangasEsperadas} (${detMangas(f)}).` }));
  if (!r.mangas.contado && !r.mangas.noAplica) issues.push({ c: 'info', k: 'Mangas', m: 'No pude contar las mangas: las piezas no tienen el talle escrito como texto. Si la prenda no lleva mangas, elegí "0 · sin mangas" arriba.' });
  const panoDet = r.pano.pedido.map(x => `Art. ${x.art}: ${x.valor}`).join(' · ');
  const panoHall = [...r.pano.textos, ...r.pano.imagenes].join(', ');
  if (r.pano.esperado && !r.pano.encontrado) issues.push({ c: 'warn', k: 'Paño', m: `El pedido lleva paño (${panoDet}) y no encontré nada rotulado "PAÑO" en el archivo. Si la franja no tiene texto, controlala a ojo antes de liberar.` });
  if (r.pano.esperado && r.pano.encontrado) issues.push({ c: 'info', k: 'Paño', m: `Paño pedido (${panoDet}) y encontrado en el archivo: ${panoHall}.` });
  if (!r.pano.esperado && r.pano.encontrado) issues.push({ c: 'warn', k: 'Paño', m: `El archivo tiene paño (${panoHall}) y los artículos marcados no lo piden.` });
  avisosPedido.forEach(a => issues.push({ c: a.nivel === 'error' ? 'bad' : 'warn', k: `Pedido · Art. ${a.art}${a.talle ? ' · talle ' + a.talle : ''}`, m: a.msg }));
  if (r.plantilla.length) issues.push({ c: 'info', k: 'Ignorado', m: `Tabla de talles del molde (número ${r.plantilla.map(p => p.n).join(', ')} en ${r.plantilla[0].talles.length} talles). No se cuenta como producción.` });

  const muestras = [];
  r.arts.forEach(a => a.filas.forEach(f => f.numeros.filter(n => n.muestra).forEach(n => muestras.push(`${tl(f.talle)} N° ${n.n}`))));

  const rows = r.porTalle.map(p => {
    const errNums = p.errores.map(e => e.n);
    const restantesOk = {};
    // chips: números del pedido en orden, marcando estado
    const faltan = [...p.faltan];
    const errs = [...errNums];
    const chips = p.numerosPedido.map(raw => {
      const n = raw.replace('*', '');
      const mu = raw.endsWith('*') ? '*' : '';
      let k = 'ok';
      const fi = faltan.indexOf(n), ei = errs.indexOf(n);
      if (fi >= 0) { k = 'miss'; faltan.splice(fi, 1); }
      else if (ei >= 0) { k = 'err'; errs.splice(ei, 1); }
      return `<span class="chip ${k}" title="${k === 'miss' ? 'Falta en el archivo' : k === 'err' ? 'Error frente/espalda' : 'OK'}">${esc(n)}${mu}</span>`;
    }).concat(p.sobran.map(n => `<span class="chip extra" title="Sobra">${esc(n)}</span>`)).join('');
    const bad = p.faltan.length || p.sobran.length || p.errores.length;
    const mfBad = r.mangas.contado && r.mangas.filas.some(f => f.talle === p.talle && f.estado !== 'ok' && (f.camisetas > 0 || f.mangasEsperadas > 0));
    const pill = mfBad && !bad ? '<span class="pill bad">Revisar</span>' : !bad ? '<span class="pill ok">OK</span>' : p.archivo === 0 ? '<span class="pill bad">No está</span>' : '<span class="pill bad">Revisar</span>';
    const mf = r.mangas.contado ? r.mangas.filas.find(f => f.talle === p.talle) : null;
    const mcell = r.mangas.noAplica ? '<span class="muted">no aplica</span>' : !mf || (!mf.camisetas && !mf.mangasEsperadas && !mf.etiquetas) ? '<span class="muted">—</span>' : mf.mangasEsperadas === 0 && mf.estado === 'ok' ? '<span class="muted">no lleva</span>' : `${mf.estado === 'sobran' && mf.mangasEsperadas === 0 ? mf.etiquetas : mf.mangas} / ${mf.mangasEsperadas}${mf.estado !== 'ok' ? ` <span class="pill bad">${mf.estado === 'faltan' ? 'faltan' : 'sobran'} ${mf.dif}</span>` : ''}`;
    return `<tr><td class="t">${esc(p.talle)}</td><td class="q">${p.pedido || p.archivo ? `${p.pedido} / ${p.archivo}` : '<span class="muted">—</span>'}</td><td>${pill}</td><td class="q">${mcell}</td><td><div class="chips">${chips}</div></td></tr>`;
  }).join('');

  const head = state.example ? '<span class="example">Ejemplo con la OC 529 · cargá tus archivos arriba</span>' : '';
  $('report').innerHTML = `
    <section class="verdict ${cls}" aria-live="polite">
      ${head}
      <div class="tag">${tag}</div>
      <div>${partes.length ? esc(partes.join(' · ')) : 'Todo lo que pide el pedido está en el archivo, con frente y espalda coincidentes.'}</div>
      <div class="meta">OC ${esc(o.numero)} · ${esc(o.cliente)} · entrega ${esc(o.entrega)} · Art. ${state.ids.join(', ')} · molde ${esc(fmtList(r.moldesArchivo) || '—')}</div>
      <div class="stats"><span><b>${r.totalPedido}</b>en el pedido</span><span><b>${r.totalArchivo}</b>en el archivo</span><span><b>${nErr}</b>con error</span><span><b>${nFalt}</b>faltan</span></div>
    </section>
    ${issues.length ? `<section class="sec"><h2>Qué revisar</h2><ul class="issues">${issues.map(i => `<li class="issue ${i.c}"><span class="k">${esc(i.k)}</span><span>${esc(i.m)}</span></li>`).join('')}</ul></section>` : ''}
    <section class="sec"><h2>Por talle</h2>
      <div class="legend"><span><span class="chip ok">8</span>está bien</span><span><span class="chip err">18</span>frente ≠ espalda</span><span><span class="chip miss">7</span>falta</span><span><span class="chip extra">5</span>sobra</span><span>* muestra</span></div>
      <div class="tablewrap"><table><thead><tr><th>Talle</th><th>Camisetas<br>pedido / archivo</th><th>Estado</th><th>Mangas<br>hay / van</th><th>Números</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>
    <section class="sec"><h2>No lo controla el archivo</h2>
      <ul class="issues"><li class="issue info"><span class="k">Con captura</span><span>Colores (${esc([...new Set(r.arts.flatMap(a => a.colores))].join(' / ') || '—')}), que el diseño coincida con el mockup, logos y escudo, y si el número está en el frente o en la espalda.${muestras.length ? ' Muestras a separar: ' + esc(muestras.join(', ')) + '.' : ''}</span></li></ul>
    </section>
    <section class="sec"><h2>Mensaje para diseño</h2>
      <textarea id="msg" readonly>${esc(buildMessage(o, r, avisosPedido))}</textarea>
      <div class="actions"><button id="copy" type="button">Copiar mensaje</button></div>
    </section>
    <details><summary>Lo que leyó del archivo (${c.textos.length} textos, ${r.garments.length} camisetas reconocidas)</summary>
      <div class="raw">${r.garments.map(g => g.k === 'ok' ? `${esc(g.n)}/${esc(tl(g.talle))}` : `<b>[${esc(g.a)}≠${esc(g.b)}]/${esc(tl(g.talle))}</b>`).join(' · ')}</div>
      <div class="raw">Imágenes: ${esc((c.imagenes || []).join(' · ') || '—')}</div>
      <div class="raw">Textos: ${esc(c.textos.join(' ; '))}</div>
    </details>`;
  $('copy').addEventListener('click', async () => {
    const t = $('msg');
    try { await navigator.clipboard.writeText(t.value); $('copy').textContent = 'Copiado'; }
    catch { t.focus(); t.select(); $('copy').textContent = 'Seleccionado, copiá con Ctrl+C'; }
    setTimeout(() => { const b = $('copy'); if (b) b.textContent = 'Copiar mensaje'; }, 2200);
  });
}

function buildMessage(o, r, avisos) {
  const L = [`Control OC ${o.numero} · ${o.cliente} · Art. ${state.ids.join(', ')} · molde ${r.moldesArchivo.join(', ') || '—'}`];
  if (!r.moldeOk) L.push(`ERROR molde: pedido ${r.moldesPedido.join(', ')} / archivo ${r.moldesArchivo.join(', ')}`);
  r.errores.forEach(e => L.push(`ERROR ${tl(e.talle)}: ${e.msg}`));
  const falt = r.porTalle.filter(p => p.faltan.length).map(p => `${tl(p.talle)}: ${p.faltan.join(', ')}`);
  if (falt.length) L.push(`FALTAN: ${falt.join(' · ')}`);
  const sob = r.porTalle.filter(p => p.sobran.length).map(p => `${tl(p.talle)}: ${p.sobran.join(', ')}`);
  if (sob.length) L.push(`SOBRAN: ${sob.join(' · ')}`);
  if (r.pano.esperado && !r.pano.encontrado) L.push('AVISO paño: el pedido lleva paño y no lo encontré rotulado en el archivo');
  if (r.mangas.contado) r.mangas.filas.filter(f => f.estado !== 'ok' && (f.camisetas > 0 || f.mangasEsperadas > 0)).forEach(f => L.push(`ERROR mangas ${tl(f.talle)}: hay ${f.mangas}, van ${f.mangasEsperadas}`));
  avisos.forEach(a => L.push(`${a.nivel === 'error' ? 'ERROR' : 'AVISO'} pedido Art. ${a.art}${a.talle ? ' ' + tl(a.talle) : ''}: ${a.msg}`));
  if (L.length === 1) L.push('OK: el archivo coincide con el pedido.');
  return L.join('\n');
}

// Arranque con el ejemplo de la OC 529
state.order = Control.parseOrder(SAMPLE.items);
state.cdr = SAMPLE.cdr;
$('namePdf').textContent = 'Ejemplo: ' + SAMPLE.pdfName;
$('nameCdr').textContent = 'Ejemplo: ' + SAMPLE.cdrName;
refresh(true);
</script>
